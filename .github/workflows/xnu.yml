name: xnu

# Builds real Apple open-source XNU (APSL) via blacktop/darwin-xnu-build (MIT).
# Expected artifact: kernel.<kernel_config_lc>.<machine_config_lc>
#   e.g. MACHINE_CONFIG=EMERALD KERNEL_CONFIG=DEVELOPMENT
#        -> kernel.development.emerald
# shim/out/Image is NOT an XNU kernel (freestanding loader only).

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: "xnu MACHINE_CONFIG — use EMERALD for MT6789 (requires 0082+0083 patches)"
        default: EMERALD
        type: choice
        options:
          - EMERALD
          - SWEET
          - VMAPPLE
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches: [main, emerald]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}-${{ inputs.machine_config || 'EMERALD' }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  ARCH_CONFIG: ARM64
  MACHINE_CONFIG: ${{ inputs.machine_config || 'EMERALD' }}

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Require EMERALD machine-config + vtimer extern patches
        if: env.MACHINE_CONFIG == 'EMERALD'
        run: |
          test -f xnu/patches/0082-emerald-machine-config.patch
          grep -q 'SUPPORTED_ARM64_MACHINE_CONFIGS.*EMERALD' xnu/patches/0082-emerald-machine-config.patch
          grep -q 'ARM64_BOARD_CONFIG_EMERALD' xnu/patches/0082-emerald-machine-config.patch
          echo "0082 EMERALD patch present"
          # 0083 must sort after 0017 and 0082 (bash *.patch is lexicographic)
          test -f xnu/patches/0083-emerald-vtimer-extern-guard.patch
          grep -q '#if defined(SWEET)' xnu/patches/0083-emerald-vtimer-extern-guard.patch
          grep -q 'sweet_vtimer_intid' xnu/patches/0083-emerald-vtimer-extern-guard.patch
          # Lexicographic order proof: 0017 < 0082 < 0083
          python3 - <<'PY'
          from pathlib import Path
          names = sorted(p.name for p in Path('xnu/patches').glob('*.patch'))
          need = [
              '0017-sweet-device-tree-virtual-timer-irq.patch',
              '0082-emerald-machine-config.patch',
              '0083-emerald-vtimer-extern-guard.patch',
          ]
          idx = [names.index(n) for n in need]
          assert idx == sorted(idx), (need, idx)
          print('patch_order_ok', *need)
          PY
          echo "0083 vtimer extern guard present (after 0017 and 0082)"

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          # blacktop build.sh: for PATCH in "${PATCH_DIR}"/*.patch  -> lexicographic
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; SWEET/EMERALD kernels are plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches/0004-sweet-machine-config.patch
          ls dxb/patches/0017-sweet-device-tree-virtual-timer-irq.patch
          ls dxb/patches/0082-emerald-machine-config.patch
          ls dxb/patches/0083-emerald-vtimer-extern-guard.patch

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
          KERNEL_CONFIG: ${{ env.KERNEL_CONFIG }}
          ARCH_CONFIG: ${{ env.ARCH_CONFIG }}
          MACHINE_CONFIG: ${{ env.MACHINE_CONFIG }}
          MACOS_VERSION: ${{ env.MACOS_VERSION }}
        run: |
          set -euo pipefail
          echo "BUILD_CMD: KERNEL_CONFIG=$KERNEL_CONFIG ARCH_CONFIG=$ARCH_CONFIG MACHINE_CONFIG=$MACHINE_CONFIG MACOS_VERSION=$MACOS_VERSION bash build.sh"
          bash build.sh

      - name: Verify real XNU kernel artifact
        if: always()
        run: |
          set -euo pipefail
          KC=$(echo "$KERNEL_CONFIG" | tr '[:upper:]' '[:lower:]')
          MC=$(echo "$MACHINE_CONFIG" | tr '[:upper:]' '[:lower:]')
          EXPECT="kernel.${KC}.${MC}"
          mkdir -p out
          # Prefer fakeroot install path; also accept objroot name
          if [ -f "dxb/fakeroot/System/Library/Kernels/$EXPECT" ]; then
            cp "dxb/fakeroot/System/Library/Kernels/$EXPECT" "out/$EXPECT"
          elif [ -f "dxb/build/xnu.obj/$EXPECT" ]; then
            cp "dxb/build/xnu.obj/$EXPECT" "out/$EXPECT"
          else
            echo "FAIL: missing real XNU kernel $EXPECT"
            echo "--- dxb/fakeroot/System/Library/Kernels ---"
            ls -la dxb/fakeroot/System/Library/Kernels/ 2>/dev/null || true
            echo "--- dxb/build/xnu.obj/kernel* ---"
            ls -la dxb/build/xnu.obj/kernel* 2>/dev/null || true
            exit 1
          fi
          # Reject confusing freestanding shim Image if ever copied here
          if [ -f out/Image ]; then
            echo "FAIL: out/Image present — shim Image must not be labeled as XNU"
            exit 1
          fi
          SIZE=$(stat -f%z "out/$EXPECT")
          SHA=$(shasum -a 256 "out/$EXPECT" | awk '{print $1}')
          # ARM64 Mach-O magic: MH_MAGIC_64 = 0xfeedfacf (LE ff fa ed fe) or CIGAM
          HEX=$(xxd -p -l 4 "out/$EXPECT")
          echo "EXPECT=$EXPECT"
          echo "SIZE=$SIZE"
          echo "SHA256=$SHA"
          echo "MAGIC_HEX=$HEX"
          case "$HEX" in
            cffaedfe|feedfacf|cafebabe|bebafeca) echo "Mach-O magic OK" ;;
            *)
              echo "FAIL: not a Mach-O kernel (got $HEX) — refusing shim/raw Image mislabel"
              exit 1
              ;;
          esac
          test "$SIZE" -gt 1000000
          (cd out && shasum -a 256 "$EXPECT" > SHA256SUMS)
          echo "XNU_KERNEL_OK=$EXPECT"

      - name: Package build tree for local compiles
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs || true

      - name: Collect listing
        if: always()
        run: |
          ls -la out || true
          cat out/SHA256SUMS 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-${{ env.MACHINE_CONFIG }}
          path: out/
          if-no-files-found: error
